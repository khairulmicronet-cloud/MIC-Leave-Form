<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3a5a8c">
<title>Micronet Leave Application Form</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">

  <header class="form-header">
    <img src="assets/micronet-logo.png" alt="Micronet International College" class="logo">
    <h1>LEAVE APPLICATION FORM</h1>
  </header>

  <nav class="page-nav">
    <a href="leave-breakdown.html">Staff Leave Breakdown &rarr;</a>
  </nav>

  <form id="leaveForm" class="form-box" novalidate>

    <div class="row">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>

    <fieldset class="row-group">
      <legend>Leave Start</legend>
      <div class="inline-fields">
        <span class="sub-label">Date:</span>
        <input type="date" id="startDate" name="startDate" required>
        <span class="sub-label">Day:</span>
        <input type="text" id="startDay" name="startDay" readonly tabindex="-1">
        <span class="sub-label">Time:</span>
        <input type="time" id="startTime" name="startTime" required>
      </div>
    </fieldset>

    <fieldset class="row-group">
      <legend>Leave End</legend>
      <div class="inline-fields">
        <span class="sub-label">Date:</span>
        <input type="date" id="endDate" name="endDate" required>
        <span class="sub-label">Day:</span>
        <input type="text" id="endDay" name="endDay" readonly tabindex="-1">
        <span class="sub-label">Time:</span>
        <input type="time" id="endTime" name="endTime" required>
      </div>
    </fieldset>

    <fieldset class="row-group">
      <legend>Resume Duty On</legend>
      <div class="inline-fields">
        <span class="sub-label">Date:</span>
        <input type="date" id="resumeDate" name="resumeDate" required>
        <span class="sub-label">Day:</span>
        <input type="text" id="resumeDay" name="resumeDay" readonly tabindex="-1">
        <span class="sub-label">Time:</span>
        <input type="time" id="resumeTime" name="resumeTime" required>
      </div>
    </fieldset>

    <div class="row">
      <label for="daysApplied">No. Of Days Applied For</label>
      <input type="number" id="daysApplied" name="daysApplied" min="0" step="0.5" required>
    </div>

    <div class="row tall">
      <label for="reason">Reason For Applying Leave</label>
      <textarea id="reason" name="reason" rows="2" required></textarea>
    </div>

    <div class="row tall">
      <label for="address">Address While On Leave</label>
      <textarea id="address" name="address" rows="2" required></textarea>
    </div>

    <div class="row">
      <label for="telephone">Telephone While On Leave</label>
      <div class="phone-field">
        <span class="prefix">+673</span>
        <input type="tel" id="telephone" name="telephone" required inputmode="numeric" placeholder="">
      </div>
    </div>

    <div class="row signature-row">
      <label for="signature">Signature <span class="hint">(upload image)</span></label>
      <div class="upload-wrap">
        <input type="file" id="signature" name="signature" accept="image/png, image/jpeg" required>
        <img id="signaturePreview" class="upload-preview" alt="Signature preview" hidden>
      </div>
    </div>

    <div class="row">
      <label for="sigDate">Date</label>
      <input type="date" id="sigDate" name="sigDate" required>
    </div>

    <div class="row">
      <label for="mcAttachment">Medical Certificate <span class="hint">(optional, upload image)</span></label>
      <div class="upload-wrap">
        <input type="file" id="mcAttachment" name="mcAttachment" accept="image/png, image/jpeg">
        <img id="mcPreview" class="upload-preview" alt="Medical certificate preview" hidden>
      </div>
    </div>

    <div class="button-row">
      <button type="button" id="downloadBtn" class="btn primary">⬇ Download Filled Form (.docx)</button>
      <button type="button" id="emailBtn" class="btn secondary">✉ Prepare Submission Email</button>
    </div>

    <p id="statusMsg" class="status-msg" role="status" aria-live="polite"></p>

  </form>

  <footer class="app-footer">
    Micronet International College &middot; Leave Application &middot; works offline once installed
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
